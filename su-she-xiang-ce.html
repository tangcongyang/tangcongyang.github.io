<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>宿舍相册</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700;900&family=Noto+Sans+SC:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f4efe3;
        --ink: #1e4636;
        --ink-soft: #51705f;
        --paper: #fffdf6;
        --line: #ddd3ba;
        --frame: #fdfbf3;
        --shadow: 0 18px 44px rgba(30, 70, 54, 0.18);
        --lb-bg: #10201a;
        --lb-ink: #f2ecdb;
        --lb-soft: #b9c8bc;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #14231c;
          --ink: #e9e2cd;
          --ink-soft: #a9bda9;
          --paper: #1d3328;
          --line: #33503f;
          --frame: #f7f2e2;
          --shadow: 0 18px 44px rgba(0, 0, 0, 0.45);
        }
      }

      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        background: var(--bg);
        color: var(--ink);
        font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      main {
        flex: 1;
        width: 100%;
        max-width: 880px;
        margin: 0 auto;
        padding: clamp(28px, 6vh, 56px) 20px 8px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      /* ---------- 页眉 ---------- */
      .masthead { text-align: center; }
      .masthead h1 {
        font-family: "Noto Serif SC", "Songti SC", serif;
        font-weight: 900;
        font-size: clamp(34px, 7vw, 52px);
        letter-spacing: 0.12em;
        margin: 0;
      }
      .masthead .en {
        margin: 10px 0 0;
        font-family: "Noto Serif SC", serif;
        font-size: 13px;
        letter-spacing: 0.55em;
        text-indent: 0.55em;
        color: var(--ink-soft);
      }
      .masthead .count {
        margin: 14px 0 0;
        font-size: 14px;
        color: var(--ink-soft);
      }

      /* ---------- 照片 ---------- */
      .photo-card {
        margin-top: clamp(28px, 5vh, 44px);
        width: min(430px, 88vw);
      }
      .photo-frame {
        background: var(--frame);
        padding: 12px 12px 14px;
        border: 1px solid var(--line);
        border-radius: 6px;
        box-shadow: var(--shadow);
        transform: rotate(-1.1deg);
      }
      .photo-frame button {
        display: block;
        width: 100%;
        padding: 0;
        border: 0;
        background: none;
        cursor: zoom-in;
      }
      .photo-frame img {
        display: block;
        width: 100%;
        height: auto;
        border-radius: 2px;
      }
      .photo-frame button:focus-visible {
        outline: 3px solid var(--ink);
        outline-offset: 3px;
      }
      .photo-caption { text-align: center; margin-top: 26px; }
      .photo-caption h2 {
        font-family: "Noto Serif SC", "Songti SC", serif;
        font-weight: 700;
        font-size: 26px;
        margin: 0;
        letter-spacing: 0.06em;
      }
      .photo-caption .meta {
        margin: 8px 0 0;
        font-size: 14px;
        color: var(--ink-soft);
        letter-spacing: 0.14em;
      }
      .photo-caption .note {
        margin: 14px auto 0;
        max-width: 30em;
        font-size: 15px;
        line-height: 1.8;
        color: var(--ink-soft);
      }
      .hint {
        margin: 18px 0 0;
        text-align: center;
        font-size: 12.5px;
        color: var(--ink-soft);
        letter-spacing: 0.1em;
      }

      /* ---------- 页脚 ---------- */
      footer {
        padding: 34px 20px 30px;
        text-align: center;
        font-size: 12.5px;
        letter-spacing: 0.08em;
        color: var(--ink-soft);
      }
      footer .rule {
        width: 44px;
        height: 1px;
        background: var(--line);
        margin: 0 auto 14px;
      }

      /* ---------- 灯箱 ---------- */
      .lightbox {
        position: fixed;
        inset: 0;
        z-index: 50;
        background: var(--lb-bg);
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }
      .lightbox.open { display: flex; }
      .lightbox figure {
        margin: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        max-height: 100%;
      }
      .lightbox img {
        max-width: min(92vw, 560px);
        max-height: 74vh;
        width: auto;
        height: auto;
        object-fit: contain;
        border: 8px solid #fdfbf3;
        border-radius: 3px;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5);
      }
      .lightbox figcaption {
        margin-top: 20px;
        text-align: center;
        color: var(--lb-ink);
      }
      .lightbox figcaption .t {
        font-family: "Noto Serif SC", serif;
        font-weight: 700;
        font-size: 21px;
        letter-spacing: 0.06em;
      }
      .lightbox figcaption .m {
        margin-top: 6px;
        font-size: 13px;
        letter-spacing: 0.14em;
        color: var(--lb-soft);
      }
      .lightbox figcaption .n {
        margin-top: 10px;
        font-size: 14.5px;
        line-height: 1.7;
        color: var(--lb-soft);
      }
      .lb-close {
        position: absolute;
        top: calc(14px + env(safe-area-inset-top));
        right: 16px;
        width: 42px;
        height: 42px;
        border-radius: 50%;
        border: 1px solid rgba(242, 236, 219, 0.4);
        background: rgba(242, 236, 219, 0.08);
        color: var(--lb-ink);
        font-size: 20px;
        line-height: 1;
        cursor: pointer;
      }
      .lb-close:focus-visible {
        outline: 3px solid var(--lb-ink);
        outline-offset: 2px;
      }

      @media (prefers-reduced-motion: no-preference) {
        .photo-card { animation: settle 0.7s ease both; }
        @keyframes settle {
          from { opacity: 0; transform: translateY(14px); }
          to { opacity: 1; transform: translateY(0); }
        }
        .lightbox.open figure { animation: zoom 0.25s ease both; }
        @keyframes zoom {
          from { opacity: 0; transform: scale(0.97); }
          to { opacity: 1; transform: scale(1); }
        }
      }
    </style>
  </head>

        <figcaption>
          <div class="t">宿舍日常</div>
          <div class="m">2025 · 日常</div>
          <div class="n">宿舍里随手拍的一张，脚丫子怼到镜头跟前。</div>

    </div>

    <script>
      (function () {
        var lb = document.getElementById("lightbox");
        var openBtn = document.getElementById("openLb");
        var closeBtn = document.getElementById("closeLb");
        var lastFocus = null;

        function openLb() {
          lastFocus = document.activeElement;
          lb.classList.add("open");
          document.body.style.overflow = "hidden";
          closeBtn.focus();
        }
        function closeLb() {
          lb.classList.remove("open");
          document.body.style.overflow = "";
          if (lastFocus) lastFocus.focus();
        }

        openBtn.addEventListener("click", openLb);
        closeBtn.addEventListener("click", closeLb);
        lb.addEventListener("click", function (e) {
          if (e.target === lb) closeLb();
        });
        document.addEventListener("keydown", function (e) {
          if (e.key === "Escape" && lb.classList.contains("open")) closeLb();
        });
      })();
    </script>
